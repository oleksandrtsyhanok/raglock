<div id="ask">
    <div id="userAsks">
        <p>Query</p>
        <input type="text" placeholder="Ask something!" [(ngModel)]="query" />
        <button (click)="onAsk()">
            {{ isLoading() ? 'Asking' : 'Submit' }}
        </button>   
    </div>

    @if (errorMsg()) {
        <p>{{ errorMsg() }}</p>
    }

    <div id="chat">
        @for (msg of messages(); track msg.id) {
            <div id="message">
                <div id="msgHead">
                    <h3>{{ msg.time }}</h3>
                    <p>{{ msg.role }}</p>
                </div>
                <div id="msgText" [innerHTML]="msg.text"></div>
                @if (msg.sources) {
                    <p> Source: {{ msg.sources }}</p>
                }
            </div>
        } @empty {
            <p>Write your question!</p>
        }
    </div>
</div>
